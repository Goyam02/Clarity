name: clarity

services:
  # --- Database (primary) ---------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clarity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clarity}
      POSTGRES_DB: ${POSTGRES_DB:-clarity}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clarity} -d ${POSTGRES_DB:-clarity}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # --- Cache ------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # --- FastAPI backend ----------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Inside the compose network the DB host is the service name.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-clarity}:${POSTGRES_PASSWORD:-clarity}@postgres:5432/${POSTGRES_DB:-clarity}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: ${ENVIRONMENT:-development}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      DEV_AUTH_ALLOW_HEADER: ${DEV_AUTH_ALLOW_HEADER:-True}
      AZURE_FOUNDRY_PROJECT_ENDPOINT: ${AZURE_FOUNDRY_PROJECT_ENDPOINT:-}
      AZURE_FOUNDRY_MODEL_DEPLOYMENT: ${AZURE_FOUNDRY_MODEL_DEPLOYMENT:-}
      WEB_RESEARCH_AGENT: ${WEB_RESEARCH_AGENT:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    env_file:
      - backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12

  # --- SPA frontend (nginx serves build + proxies /api to backend) ---------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
