name: clarity

services:
  # --- Database (primary) ---------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clarity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clarity}
      POSTGRES_DB: ${POSTGRES_DB:-clarity}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clarity} -d ${POSTGRES_DB:-clarity}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # --- Cache ------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # --- Judge0 CE (self-hosted code execution judge) ------------------------------
  # Sandboxed submission runner for Python/Java/C++/SQL (isolate sandbox).
  # Privileged is required by isolate (cgroups/seccomp). Its own db+redis are
  # named judge0-* so they never collide with the app's postgres/redis.
  judge0-server:
    image: judge0/judge0:latest
    ports:
      - "2358:2358"
    environment:
      REDIS_HOST: judge0-redis
      REDIS_PASSWORD: ${JUDGE0_REDIS_PASSWORD:-judge0-redis-pass}
      POSTGRES_HOST: judge0-db
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: ${JUDGE0_POSTGRES_PASSWORD:-judge0-db-pass}
      ENABLE_WAIT_RESULT: "true"
      ENABLE_BATCHED_SUBMISSIONS: "true"
      MAX_SUBMISSION_BATCH_SIZE: 20
      ENABLE_TOKENS: "false"       # compose-network-internal; flip on for prod
      JUDGE0_TELEMETRY_ENABLE: "false"
    privileged: true
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:2358/system_info > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 60s
    restart: always

  judge0-worker:
    image: judge0/judge0:latest
    command: ["./scripts/workers"]
    environment:
      REDIS_HOST: judge0-redis
      REDIS_PASSWORD: ${JUDGE0_REDIS_PASSWORD:-judge0-redis-pass}
      POSTGRES_HOST: judge0-db
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: ${JUDGE0_POSTGRES_PASSWORD:-judge0-db-pass}
      JUDGE0_TELEMETRY_ENABLE: "false"
    privileged: true
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy
    restart: always

  judge0-db:
    image: postgres:16.2
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: ${JUDGE0_POSTGRES_PASSWORD:-judge0-db-pass}
    volumes:
      - judge0dbdata:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judge0 -d judge0"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: always

  judge0-redis:
    image: redis:7.2.4
    command: ["bash", "-c", "docker-entrypoint.sh --appendonly no --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${JUDGE0_REDIS_PASSWORD:-judge0-redis-pass}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: always

  # --- FastAPI backend ----------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Inside the compose network the DB host is the service name.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-clarity}:${POSTGRES_PASSWORD:-clarity}@postgres:5432/${POSTGRES_DB:-clarity}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: ${ENVIRONMENT:-development}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      DEV_AUTH_ALLOW_HEADER: ${DEV_AUTH_ALLOW_HEADER:-True}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Judge0 self-hosted judge (same compose network).
      JUDGE0_BASE_URL: ${JUDGE0_BASE_URL:-http://judge0-server:2358}
      JUDGE0_AUTH_TOKEN: ${JUDGE0_AUTH_TOKEN:-}
      # NOTE: AZURE_FOUNDRY_* / GEMINI_API_KEY intentionally NOT set here.
      # An explicit `environment:` entry overrides `env_file: backend/.env`,
      # which used to blank the Foundry endpoint inside the container (the
      # "azure endpoint not set up" 500 on resume upload). backend/.env wins now.
    env_file:
      - backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      judge0-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12

  # --- SPA frontend (nginx serves build + proxies /api to backend) ---------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  judge0data:
  judge0dbdata:
